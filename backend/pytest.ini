[pytest]
addopts = -p no:pytest_ethereum --ignore=clean_build_env
markers =
    unit: Tests that can run natively without external dependencies
    integration: Tests requiring external services (Redis, ClamAV, Besu, liboqs)
    docker: Tests explicitly designed to run inside the Linux Docker environment
    pqc: Tests requiring the real liboqs Post-Quantum Cryptography bindings
    redis: Tests requiring a live Redis backend
    besu: Tests requiring a live Hyperledger Besu node
    clamav: Tests requiring a live ClamAV daemon
    network: Tests requiring network interaction (e.g. Scapy, anomaly monitoring)
    slow: Tests that take a long time to run
    windows_compatible: Integration tests that theoretically work on Windows if services are present
