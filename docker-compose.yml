version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: secureft_postgres
    environment:
      POSTGRES_USER: secureft
      POSTGRES_PASSWORD: secureft_password
      POSTGRES_DB: secureft_db
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U secureft -d secureft_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: secureft_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
    container_name: secureft_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://secureft:secureft_password@postgres:5432/secureft_db
      - REDIS_URL=redis://redis:6379/0
      - FRONTEND_ORIGIN=http://localhost
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      # Mount storage directory for logs, dataset, etc.
      - ./backend/app/storage:/app/app/storage

  frontend:
    build:
      context: ./frontend
    container_name: secureft_frontend
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
